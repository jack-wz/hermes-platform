name: Hermes Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Unit Tests ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pyyaml flask

      - name: Run unit tests
        run: python3 -m pytest tests/test-memory.py -v

  # ── Integration Tests ──────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pyyaml flask

      - name: Start Dashboard server
        run: |
          python3 build/workspace/hermes-dashboard.py &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:5002/api/status > /dev/null 2>&1; then
              echo "Dashboard ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        run: python3 tests/test-integration.py

  # ── Docker Build ───────────────────────────────────────────────
  docker-build:
    name: Docker Build & Verify
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hermes-workspace:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker run --rm -d --name hermes-ci -p 5002:5002 hermes-workspace:ci-${{ github.sha }}
          # Wait for health check
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' hermes-ci 2>/dev/null | grep -q healthy; then
              echo "Container healthy after ${i}s"
              break
            fi
            sleep 2
          done
          HEALTH=$(docker inspect --format='{{.State.Health.Status}}' hermes-ci)
          echo "Container health: $HEALTH"
          if [ "$HEALTH" != "healthy" ]; then
            docker logs hermes-ci
            exit 1
          fi
          docker stop hermes-ci

  # ── Self-Scan (eat your own dogfood) ───────────────────────────
  self-scan:
    name: Self-Scan with hermes-scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-scan
        run: python3 build/phase2/hermes-scan.py build/phase1/example-skill.SKILL.md --json

  # ── Lint ───────────────────────────────────────────────────────
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: |
          flake8 build/workspace/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 build/phase2/ build/phase3/ build/phase4/ --count --select=E9,F63,F7,F82 --show-source --statistics
