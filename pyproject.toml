[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-workspace"
version = "2.0.0"
description = "Open-source AI team workspace — AI coworkers, shared memory, Kanban dashboard, skill marketplace, security audit"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hermes Workspace", email = "jack-wz@users.noreply.github.com"}]
keywords = ["ai", "agent", "workspace", "skill", "automation", "multi-agent", "mcp", "kanban", "marketplace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "werkzeug>=3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/jack-wz/hermes-platform"
Documentation = "https://github.com/jack-wz/hermes-platform#readme"
Repository = "https://github.com/jack-wz/hermes-platform"
Issues = "https://github.com/jack-wz/hermes-platform/issues"

[project.scripts]
hermes-ws = "hermes_cli:main"

[tool.setuptools]
py-modules = ["hermes_cli"]

[tool.setuptools.package-data]
"*" = ["build/**/*.py", "build/**/*.md", "registry/*.json", "registry/**/*.SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
